name: sequence
description: "Sequence — the online multiplayer board game. Create a room, share the code, and race to five in a row."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icon font the Flutter framework itself refers to; without it the web
  # build warns about missing CupertinoIcons glyphs.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  shared_preferences: ^2.5.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
